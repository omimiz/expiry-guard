<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PERPETUA — Private Rewards Folio</title>
    <meta name="description" content="Bespoke loyalty asset preservation for high-net-worth individuals. Zero-credential point decay tracking and capital protection." />
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#08080a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perpetua" />
  </head>
  <body class="bg-[#08080a] text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Perpetua SW active:', reg.scope))
            .catch((err) => console.warn('Perpetua SW registration failed:', err))
        })
      }
    </script>
  </body>
</html>
