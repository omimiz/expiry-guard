<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="35%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer ambient glow -->
  <path d="M256 64 C352 64 416 112 416 224 C416 352 288 432 256 448 C224 432 96 352 96 224 C96 112 160 64 256 64 Z" fill="url(#shieldGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Shield Body -->
  <path d="M256 80 C340 80 396 122 396 224 C396 340 284 414 256 428 C228 414 116 340 116 224 C116 122 172 80 256 80 Z" fill="url(#shieldGrad)" />

  <!-- Card Pass silhouette overlay -->
  <rect x="180" y="150" width="152" height="100" rx="14" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" />
  <circle cx="210" cy="185" r="12" fill="#FFFFFF" fill-opacity="0.6" />
  <line x1="235" y1="180" x2="310" y2="180" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" />
  <line x1="235" y1="192" x2="285" y2="192" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />

  <!-- Checkmark / Clock dial in shield -->
  <circle cx="256" cy="300" r="44" fill="#090D16" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4" />
  <path d="M256 276 V302 L274 314" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

